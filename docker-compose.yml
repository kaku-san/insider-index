# Barely Stable / Hetzner + Traefik. Public host is locked.
# Router rule must stay Host(`stocklana.barelystable.dev`).
#
# Runtime secrets: /srv/projects/stocklana/.env (gitignored, never rsynced).
# NEXT_PUBLIC_* from that file are also passed as build args.

services:
  stocklana:
    build:
      context: .
      args:
        NEXT_PUBLIC_PRIVY_APP_ID: ${NEXT_PUBLIC_PRIVY_APP_ID:-}
        NEXT_PUBLIC_PRIVY_APPID: ${NEXT_PUBLIC_PRIVY_APPID:-}
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}
    restart: unless-stopped
    env_file:
      - .env
    expose:
      - "3000"
    labels:
      - traefik.enable=true
      - traefik.http.routers.stocklana.rule=Host(`stocklana.barelystable.dev`)
      - traefik.http.routers.stocklana.entrypoints=websecure
      - traefik.http.routers.stocklana.tls=true
      - traefik.http.routers.stocklana.tls.certresolver=${TRAEFIK_CERTRESOLVER:-letsencrypt}
      - traefik.http.services.stocklana.loadbalancer.server.port=3000
    networks:
      - proxy

networks:
  proxy:
    external: true
    name: ${TRAEFIK_NETWORK:-proxy}
